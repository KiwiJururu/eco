name: Living Ecology QA Cleanup

on:
  push:
    branches: [ 'development/qa-0.1.0' ]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove temporary QA overlay artifacts
        run: |
          rm -rf .qa
          rm -f .github/workflows/materialize-cleanup.yml
          git config user.name "Living Ecology CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: remove temporary QA overlay artifacts"
          git push origin HEAD:${GITHUB_REF_NAME}
