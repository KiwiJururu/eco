name: Living Ecology Nightly Stable

on:
  schedule:
    # 06:30 UTC = 03:30 in Brazil UTC-3. Scheduled workflows use UTC.
    - cron: '30 6 * * *'
  workflow_dispatch:

concurrency:
  group: living-ecology-nightly-stable
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  full-regression:
    name: Full regression of development/stable
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: Eco

    steps:
      - name: Checkout validated development baseline
        uses: actions/checkout@v4
        with:
          ref: development/stable

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: Eco/**/*.gradle*

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Record tested commit
        run: git rev-parse HEAD
        working-directory: .

      - name: Compile main sources
        run: ./gradlew compileJava --stacktrace

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Run Forge GameTests
        run: ./gradlew runGameTestServer --stacktrace

      - name: Build mod
        run: ./gradlew build --stacktrace

      - name: Upload nightly failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: living-ecology-nightly-failure-${{ github.run_id }}
          path: |
            Eco/build/reports/**
            Eco/run/logs/**
            Eco/run/crash-reports/**
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload nightly JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: living-ecology-nightly-${{ github.run_id }}
          path: Eco/build/libs/*.jar
          if-no-files-found: error
          retention-days: 7
