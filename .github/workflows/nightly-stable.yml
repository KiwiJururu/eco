name: Living Ecology Nightly Stable

on:
  schedule:
    # 06:30 UTC = 03:30 in Brazil UTC-3. Scheduled workflows use UTC.
    - cron: '30 6 * * *'
  workflow_dispatch:

concurrency:
  group: living-ecology-nightly-stable
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  full-regression:
    name: Full regression of development/stable
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: Eco

    steps:
      - name: Checkout validated development baseline
        uses: actions/checkout@v4
        with:
          ref: development/stable

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: Eco/**/*.gradle*

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Record tested commit
        run: echo "STABLE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Compile main sources
        run: ./gradlew compileJava --stacktrace

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Run Forge GameTests
        run: ./gradlew runGameTestServer --stacktrace

      - name: Build mod
        run: ./gradlew build --stacktrace

      - name: Upload nightly failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: living-ecology-nightly-failure-${{ github.run_id }}
          path: |
            Eco/build/reports/**
            Eco/run/logs/**
            Eco/run/crash-reports/**
          if-no-files-found: ignore
          retention-days: 30

      - name: Open or update nightly failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'Nightly regression failure in:title' --json number --jq '.[0].number // empty')"
          body="Nightly full regression failed for development/stable commit ${STABLE_SHA}. Run: ${RUN_URL}. Failure logs were uploaded as a workflow artifact. Do not advance the active gameplay family until this regression is understood."
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Nightly regression failure" --body "$body"
          fi

      - name: Resolve previous nightly failure issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'Nightly regression failure in:title' --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Nightly regression is green again on development/stable commit ${STABLE_SHA}. Run: ${RUN_URL}."
            gh issue close "$existing" --repo "$GITHUB_REPOSITORY" --reason completed
          fi

      - name: Upload nightly JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: living-ecology-nightly-${{ github.run_id }}
          path: Eco/build/libs/*.jar
          if-no-files-found: error
          retention-days: 7
