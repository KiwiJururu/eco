name: Living Ecology CI

on:
  push:
    branches: [ main, development/stable ]
  pull_request:
    branches: [ main, development/stable ]
  workflow_dispatch:

# A newer commit on the same branch/PR makes the older run obsolete. Cancelling it is
# especially valuable once the GameTest suite grows to dozens of species scenarios.
concurrency:
  group: living-ecology-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qa:
    name: Compile, unit tests, GameTests and build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: Eco

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: Eco/**/*.gradle*

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Compile main sources
        run: ./gradlew compileJava --stacktrace

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Run Forge GameTests
        run: ./gradlew runGameTestServer --stacktrace

      - name: Build mod
        run: ./gradlew build --stacktrace

      - name: Upload QA logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: living-ecology-qa-logs-${{ github.sha }}
          path: |
            Eco/build/reports/**
            Eco/run/logs/**
            Eco/run/crash-reports/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload built JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: living-ecology-${{ github.sha }}
          path: Eco/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
