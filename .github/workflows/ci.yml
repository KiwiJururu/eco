name: Living Ecology CI

on:
  push:
    branches: [ main, 'development/**' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qa:
    name: Compile, unit tests, GameTests and build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: Eco

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply development source overlay
        run: |
          cat ../.qa/overlay.b64.* | tr -d '\n\r' | base64 -d > /tmp/living_overlay.tgz
          gzip -t /tmp/living_overlay.tgz
          tar -xzf /tmp/living_overlay.tgz -C .
          shopt -s nullglob
          for patch in ../.qa/patch*.b64; do
            name="$(basename "$patch" .b64)"
            tr -d '\n\r' < "$patch" | base64 -d > "/tmp/${name}.tgz"
            gzip -t "/tmp/${name}.tgz"
            tar -xzf "/tmp/${name}.tgz" -C .
          done

      - name: Materialize overlay into branch
        if: github.event_name == 'push' && github.ref_name == 'development/qa-0.1.0'
        run: |
          git config user.name "Living Ecology CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A .
          if git diff --cached --quiet; then
            echo "Overlay already materialized; no source commit needed."
          else
            echo "Files materialized from QA overlay:"
            git diff --cached --name-status
            git commit -m "chore: materialize QA overlay into source"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: Eco/**/*.gradle*

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Compile main sources
        run: ./gradlew compileJava --stacktrace

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Run Forge GameTests
        run: ./gradlew runGameTestServer --stacktrace

      - name: Build mod
        run: ./gradlew build --stacktrace

      - name: Upload QA logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: living-ecology-qa-logs-${{ github.sha }}
          path: |
            Eco/build/reports/**
            Eco/run/logs/**
            Eco/run/crash-reports/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload built JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: living-ecology-${{ github.sha }}
          path: Eco/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
