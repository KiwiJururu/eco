name: Living Ecology CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile and build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: Eco

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: Eco/**/*.gradle*

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Compile Java
        run: ./gradlew compileJava --stacktrace

      - name: Build mod
        run: ./gradlew build --stacktrace

      - name: Upload built JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: living-ecology-${{ github.sha }}
          path: Eco/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
